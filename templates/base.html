<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UpWatch{% endblock %} – UpWatch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'backoffice:dashboard' %}">UpWatch</a>
    {% if user.is_authenticated %}
      <form class="d-flex align-items-center gap-2 ms-auto" method="post" action="{% url 'admin:logout' %}">
        {% csrf_token %}
        <span class="navbar-text small">{{ user.email }}</span>
        <button type="submit" class="btn btn-sm btn-outline-light">Ieșire</button>
      </form>
    {% endif %}
  </div>
</nav>

<main class="container pb-5">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Închide"></button>
    </div>
  {% endfor %}

  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
