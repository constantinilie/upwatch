{% if monitor.status == "up" %}<span class="badge text-bg-success">Up</span>
{% elif monitor.status == "down" %}<span class="badge text-bg-danger">Down</span>
{% elif monitor.status == "paused" %}<span class="badge text-bg-secondary">Pe pauză</span>
{% else %}<span class="badge text-bg-light border">În așteptare</span>{% endif %}
